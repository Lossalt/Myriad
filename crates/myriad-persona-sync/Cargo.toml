[package]
name = "myriad-persona-sync"
version = "0.1.0"
edition = "2024"
publish = false
description = "Her data across the site and other platforms: the sync format, its canonical bytes, the clock and the comparison of two of her."
authors = ["Myriad Contributors"]
license = "AGPL-3.0-only"

# Pure: no I/O, no clock, no randomness (the archive takes its salt and
# nonces from the caller). The site links it directly and the shared core
# (`myriad-core-ffi`) links it for every other platform, so both sides
# write the same bytes.
[dependencies]
# The export file (`archive`): the key from the passphrase, the chunks
# sealed.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
myriad-merope = { path = "../myriad-merope" }
serde = { version = "1", features = ["derive"] }
# Both sides parse numbers back to the exact same bits, so a body's digest
# does not depend on which side read it.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
# A passphrase typed on another system reads the same (NFC).
unicode-normalization = "0.1"
